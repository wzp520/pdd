name: Build Windows EXE

on:
  workflow_dispatch: # 手动触发
  push:
    tags: ["v*"] # 打 v 开头的 tag 时自动打包并发 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller pddbot.spec

      - name: 压缩成 zip
        run: Compress-Archive -Path dist/pddbot/* -DestinationPath pddbot-windows.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pddbot-windows
          path: pddbot-windows.zip

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pddbot-windows.zip
